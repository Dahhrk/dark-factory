# Kitchen CI — visibility / secrets / path scrub

name: kitchen-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on absolute Windows user paths in tracked files
        run: |
          set -euo pipefail
          if git grep -nE 'C:\\Users\\' -- .; then
            echo "::error::Absolute C:\\Users\\ paths found. Use ~/Projects/... instead."
            exit 1
          fi
      - name: Fail on secret-looking tokens in tracked files
        run: |
          set -euo pipefail
          if git grep -nE 'xox[baprs]-|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' -- .; then
            echo "::error::Secret-looking token pattern found in tracked files"
            exit 1
          fi
      - name: Required kitchen files present
        run: |
          test -f VISIBILITY.md
          test -f PUBLIC.md
          test -f docs/storage-layout.md
          test -f docs/SETUP-STATUS.md
          test -f audit/decisions.tsv
          head -n1 audit/decisions.tsv | grep -qx $'ts\tphase\tdecision\twhy\tevidence\tresult'
      - name: No 0.0.0.0 listen binds in handoff server
        run: |
          set -euo pipefail
          TARGET="automations/grok-bot/cursor-handoff/server.mjs"
          if grep -nE 'listen\s*\([^)]*"0\.0\.0\.0"' "$TARGET"; then
            echo "::error::${TARGET} binds 0.0.0.0 — must use 127.0.0.1 or HANDOFF_HOST."
            exit 1
          fi
          echo "ok: no 0.0.0.0 listen bind in ${TARGET}"
      - name: Status/automation edits need a decisions.tsv row
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "$BASE"..."$HEAD")
          ALLOWLIST=".github/decisions-touch-allowlist"
          is_allowed() {
            local f="$1"
            [[ -f "$ALLOWLIST" ]] || return 1
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              [[ -z "$line" ]] && continue
              case "$f" in
                "$line"|"$line"/*) return 0 ;;
              esac
            done < "$ALLOWLIST"
            return 1
          }
          triggers=()
          for f in "${CHANGED[@]}"; do
            case "$f" in
              automations/*|docs/SETUP-STATUS.md|docs/STILL-YOU.md) ;;
              *) continue ;;
            esac
            if is_allowed "$f"; then
              echo "allowlisted (no decisions.tsv required): $f"
              continue
            fi
            triggers+=("$f")
          done
          if [[ ${#triggers[@]} -eq 0 ]]; then
            echo "No status/automation trigger paths in this PR."
            exit 0
          fi
          echo "Trigger paths:"
          printf '  %s\n' "${triggers[@]}"
          for f in "${CHANGED[@]}"; do
            if [[ "$f" == "audit/decisions.tsv" ]]; then
              echo "decisions.tsv changed in the same PR — ok"
              exit 0
            fi
          done
          echo "::error::PR touches status/automation paths but not audit/decisions.tsv. Append a row (or allowlist under .github/decisions-touch-allowlist)."
          exit 1
