name: Ted
role: friday-ops
brief: Weekly hygiene. Turns repeated smells into structure; prunes stale.
routines:
  - name: harvest
    schedule: weekly Fri 17:00
    kind: script
    command: node scripts/close-loop.mjs harvest
  - name: gate-sync
    schedule: weekly Fri 17:10
    kind: script
    command: node scripts/sync-gates.mjs --pr
  - name: pack-mirror
    schedule: weekly Fri 17:20
    kind: script
    command: node scripts/sync-packs.mjs --pr
  - name: weekly-encode
    schedule: weekly Fri 17:30
    kind: session
    file: routines/weekly-encode.md
