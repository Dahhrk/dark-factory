# Devin cloud environment for this product.
# Git-backed blueprint — Devin discovers it at the repo root and builds cloud
# session environments from it. No secrets belong here; seed apps stay
# secret-free.

maintenance: |
  git config user.name "{{GIT_NAME}}"
  git config user.email "{{GIT_EMAIL}}"
  npm ci

knowledge:
  - name: test
    contents: |
      Friend verify — run on every unit of work before push:
        npm test
      (typecheck → lint → boundaries → anti-ai-ui; wired by the bootstrap)

  - name: build
    contents: |
      npm run build

  - name: rules
    contents: |
      Draft PRs only — the author never merges; a Bugbot or fresh-verifier
      VERIFIED verdict certifies. Autopilot stays off. One verifiable unit
      per PR with Done means + Keep.
      Product proof is the control-<app> CLI once it exists — generate it
      with /pstack:create-verification-skill, maintain with
      /pstack:maintain-verification-skill. A self-report is not done.
